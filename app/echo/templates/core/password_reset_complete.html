{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{% trans "Mot de passe réinitialisé" %}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0F1117; color: #E2E8F0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #1A1D2B; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; text-align: center; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  p { color: #9BAFCA; font-size: 14px; }
  a { display: inline-block; margin-top: 24px; padding: 12px 32px; background: #4A9EFF; color: #fff; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; }
  a:hover { background: #60B4FF; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h2>{% trans "Mot de passe réinitialisé !" %}</h2>
  <p>{% trans "Votre mot de passe a été mis à jour avec succès." %}</p>
  <a href="/accounts/login/">{% trans "Se connecter" %}</a>
</div>
</body>
</html>
