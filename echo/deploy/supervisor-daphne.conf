[program:echo-daphne]
command=/var/www/echo/venv/bin/daphne -b 127.0.0.1 -p 9000 echo.asgi:application
directory=/var/www/echo
user=root
autostart=true
autorestart=true
stderr_logfile=/var/www/echo/logs/daphne.err.log
stdout_logfile=/var/www/echo/logs/daphne.out.log
environment=DJANGO_SETTINGS_MODULE="echo.settings.production"
