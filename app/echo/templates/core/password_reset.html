{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{% trans "Mot de passe oublié" %}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0F1117; color: #E2E8F0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #1A1D2B; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; }
  h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  p { color: #9BAFCA; font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #9BAFCA; margin-bottom: 6px; }
  input { width: 100%; padding: 11px 14px; background: #252836; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #E2E8F0; font-size: 14px; outline: none; box-sizing: border-box; }
  input:focus { border-color: #4A9EFF; }
  button { width: 100%; margin-top: 20px; padding: 12px; background: #4A9EFF; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #60B4FF; }
  .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #9BAFCA; text-decoration: none; }
  .back:hover { color: #E2E8F0; }
</style>
</head>
<body>
<div class="card">
  <h2>{% trans "Mot de passe oublié ?" %}</h2>
  <p>{% trans "Entrez votre adresse email et nous vous enverrons un lien de réinitialisation." %}</p>
  <form method="post">
    {% csrf_token %}
    <label>{% trans "Adresse email" %}</label>
    <input type="email" name="email" autofocus required placeholder="doctor@example.com"/>
    <button type="submit">{% trans "Envoyer le lien" %}</button>
  </form>
  <a href="/accounts/login/" class="back">← {% trans "Retour à la connexion" %}</a>
</div>
</body>
</html>
