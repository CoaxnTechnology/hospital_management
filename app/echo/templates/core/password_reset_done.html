{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{% trans "Email envoyé" %}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0F1117; color: #E2E8F0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #1A1D2B; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; text-align: center; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  p { color: #9BAFCA; font-size: 14px; line-height: 1.6; }
  a { display: inline-block; margin-top: 24px; font-size: 13px; color: #4A9EFF; text-decoration: none; }
  a:hover { color: #60B4FF; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📧</div>
  <h2>{% trans "Email envoyé !" %}</h2>
  <p>{% trans "Si un compte existe avec cette adresse email, vous recevrez un lien de réinitialisation dans quelques minutes. Vérifiez également vos spams." %}</p>
  <a href="/accounts/login/">← {% trans "Retour à la connexion" %}</a>
</div>
</body>
</html>
