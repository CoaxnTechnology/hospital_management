# =====================================================================
# Nginx configuration for Admin subdomain
# admin.clinicalgynecologists.space -> Django /admin/
# =====================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name admin.clinicalgynecologists.space;
    return 301 https://$host$request_uri;
}

# HTTPS admin server
server {
    listen 443 ssl http2;
    server_name admin.clinicalgynecologists.space;

    ssl_certificate /etc/nginx/ssl/admin.clinicalgynecologists.space.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.clinicalgynecologists.space.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # Static files (same directory as main app)
    location /static/ {
        alias /home/echo/echo/public/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Root → redirect to super admin panel
    location = / {
        return 302 https://$host/super-admin/;
    }

    # Proxy all requests to the main Gunicorn (port 8001)
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
